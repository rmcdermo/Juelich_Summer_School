  </g>
  <g fill="#000" font-family="Arial, Helvetica, sans-serif" font-size="68" text-anchor="middle" dominant-baseline="central">
    <text x="140" y="46">H</text><text x="300" y="46">H</text><text x="460" y="46">H</text><text x="140" y="314">H</text><text x="300" y="314">H</text><text x="460" y="314">H</text>
