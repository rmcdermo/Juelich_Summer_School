<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Top-hat filter kernel</title>
  <desc id="desc">The filter kernel is zero outside plus or minus one half of the filter width and one inside that interval.</desc>
  <rect width="760" height="520" fill="#ffffff"/>

  <g fill="none" stroke="#666666" stroke-width="1.4">
    <rect x="86" y="30" width="638" height="408"/>
    <path d="M86 438H724 M86 30V438"/>
  </g>

  <g fill="none" stroke="#777777" stroke-width="1.2">
    <path d="M86 438v7 M165.75 438v7 M245.5 438v7 M325.25 438v7 M405 438v7 M484.75 438v7 M564.5 438v7 M644.25 438v7 M724 438v7"/>
    <path d="M79 411H86 M79 356.6H86 M79 302.2H86 M79 247.8H86 M79 193.4H86 M79 139H86 M79 84.6H86 M79 30.2H86"/>
  </g>

  <g fill="#111111" font-family="STIX Two Text, STIXGeneral, Times New Roman, serif" font-size="19">
    <text x="86" y="470" text-anchor="middle">−2.0</text>
    <text x="165.75" y="470" text-anchor="middle">−1.5</text>
    <text x="245.5" y="470" text-anchor="middle">−1.0</text>
    <text x="325.25" y="470" text-anchor="middle">−0.5</text>
    <text x="405" y="470" text-anchor="middle">0.0</text>
    <text x="484.75" y="470" text-anchor="middle">0.5</text>
    <text x="564.5" y="470" text-anchor="middle">1.0</text>
    <text x="644.25" y="470" text-anchor="middle">1.5</text>
    <text x="724" y="470" text-anchor="middle">2.0</text>

    <text x="70" y="417" text-anchor="end">0.0</text>
    <text x="70" y="362.6" text-anchor="end">0.2</text>
    <text x="70" y="308.2" text-anchor="end">0.4</text>
    <text x="70" y="253.8" text-anchor="end">0.6</text>
    <text x="70" y="199.4" text-anchor="end">0.8</text>
    <text x="70" y="145" text-anchor="end">1.0</text>
    <text x="70" y="90.6" text-anchor="end">1.2</text>
    <text x="70" y="36.2" text-anchor="end">1.4</text>
  </g>

  <path d="M86 411H325.25V139H484.75V411H724" fill="none" stroke="#0000ff" stroke-linejoin="miter" stroke-width="4"/>

  <g font-family="STIX Two Text, STIXGeneral, Times New Roman, serif" font-size="21">
    <line x1="500" y1="61" x2="552" y2="61" stroke="#0000ff" stroke-width="4"/>
    <text x="570" y="68" fill="#111111">tophat kernel</text>
  </g>

  <text x="405" y="512" fill="#111111" font-family="STIX Two Math, STIXGeneral, Times New Roman, serif" font-size="28" font-style="italic" text-anchor="middle">r / Δ</text>
  <text x="27" y="235" fill="#111111" font-family="STIX Two Math, STIXGeneral, Times New Roman, serif" font-size="28" font-style="italic" text-anchor="middle" transform="rotate(-90 27 235)">G(r)</text>
</svg>
